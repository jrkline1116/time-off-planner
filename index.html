<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Off Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
/* Layout: single column. Inputs on top, then "now vs. later" balances, then the time off in between, then a short paycheck table. */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --fg:#17212b; --muted:#5b6873; --line:#d5dde2; --soft:#eaf0f2;
  --accent:#1f5f78; --accent-fg:#ffffff;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171c; --panel:#172129; --fg:#e4eaee; --muted:#9aa8b2; --line:#2c3a44; --soft:#1d2a33; --accent:#7cc0d8; --accent-fg:#0d1a20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171c; --panel:#172129; --fg:#e4eaee; --muted:#9aa8b2; --line:#2c3a44; --soft:#1d2a33; --accent:#7cc0d8; --accent-fg:#0d1a20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:10px}
h1{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:clamp(26px,4vw,34px);margin:0}
h2{font-family:var(--display);font-stretch:90%;font-size:17px;font-weight:700;margin:0 0 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.link{border:none;background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:600}
button.x{padding:4px 10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600;color:var(--muted)}
input,select{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-size:14px}
.sub{font-size:13px;color:var(--muted);margin:10px 0 0}
.req{display:grid;grid-template-columns:150px 80px 120px minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:620px){.req{grid-template-columns:1fr 80px 1fr auto}.req .note{grid-column:1/-1;order:5}}
.rows{display:flex;flex-direction:column;gap:8px}
.add{margin-top:10px}
/* results */
.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
@media (max-width:620px){.compare{grid-template-columns:1fr}.arrow{display:none}}
.bal{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.bal.later{border:2px solid var(--fg)}
.bal .when{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bal .date{font-family:var(--display);font-stretch:90%;font-weight:700;font-size:19px;margin-bottom:8px}
.bal dl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:0;font-variant-numeric:tabular-nums}
.bal dt{color:var(--muted)}
.bal dd{margin:0;font-family:var(--mono);text-align:right}
.bal .tot{border-top:1px solid var(--line);padding-top:5px;margin-top:3px;font-weight:700;color:var(--fg)}
.bal .tot+dd{border-top:1px solid var(--line);padding-top:5px;margin-top:3px;font-weight:700;font-size:17px}
.arrow{align-self:center;font-size:22px;color:var(--muted)}
.between table,.ledger table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
th.l,td.l{text-align:left}
td.n{font-family:var(--mono);font-size:13.5px}
td.wr{white-space:normal}
tfoot td{font-weight:700;border-bottom:none;border-top:2px solid var(--fg)}
.tablewrap{overflow-x:auto}
td.short{font-weight:700}
.yr td{background:var(--soft);font-weight:700;text-align:left;font-size:13px}
.empty{color:var(--muted)}
.printhead{display:none}
.copied{font-size:13px;color:var(--muted)}
@media print{
  @page{size:letter portrait;margin:.4in}
  :root{--bg:#fff;--panel:#fff;--fg:#000;--muted:#333;--line:#999;--soft:#e8e8e8;color-scheme:light}
  body{font-size:9.5pt;line-height:1.25}
  .wrap{padding:0;max-width:none;gap:8px}
  .noprint{display:none!important}
  .printhead{display:block}
  .printhead h1{font-size:16pt}
  .printhead p{margin:2px 0;font-size:9pt}
  header{display:none}
  .card,.bal{padding:6px 8px;border-radius:0}
  h2{font-size:11pt;margin-bottom:4px}
  .bal .date{font-size:12pt;margin-bottom:3px}
  th,td{padding:1.5px 5px}
  .between table,.ledger table{font-size:8.5pt}
  td.n{font-size:8.5pt}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Time Off Planner</h1>
    </div>
    <div class="btns noprint">
      <button id="copyBtn" type="button">Copy summary</button>
      <button id="printBtn" type="button" class="primary" hidden>Print</button>
      <span id="copied" class="copied" hidden>Copied</span>
    </div>
  </header>

  <div class="printhead" id="printhead"></div>

  <section class="card noprint">
    <h2>What I have now</h2>
    <div class="fields">
      <label>Name<input id="name" type="text" autocomplete="off"></label>
      <label>From paycheck<select id="anchor"></select></label>
      <label>PTO balance<input id="ptoBal" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label>PTO earned per paycheck<input id="rate" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label>PSL balance<input id="pslBal" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label>PSL used so far this year<input id="pslUsed" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label>Floating holiday hours<input id="fltBal" type="number" step="0.5" min="0" inputmode="decimal"></label>
      <label>Pay type<select id="etype"><option value="salaried">Salaried</option><option value="hourly">Hourly</option></select></label>
      <label>Hours worked per pay period<input id="hrsWorked" type="number" step="1" min="0" inputmode="decimal"></label>
    </div>
    <p class="sub">Use the balances on that paycheck stub. Example numbers are filled in. <button type="button" class="link" id="clearBtn">Clear everything</button></p>
  </section>

  <section class="card noprint">
    <h2>Planned time off</h2>
    <div class="rows" id="reqRows"></div>
    <button type="button" class="add" id="addReq">+ Add a day</button>
  </section>

  <section class="card noprint">
    <h2>What will I have on</h2>
    <div class="fields"><label>Paycheck<select id="target"></select></label></div>
  </section>

  <div id="results">
    <div class="compare" id="compare"></div>
  </div>

  <section class="card between" id="betweenCard"></section>

  <section class="card ledger" id="ledgerCard">
    <h2>Paycheck by paycheck</h2>
    <div class="tablewrap"><table id="ledger"></table></div>
  </section>
</div>

<script>
(function(){
"use strict";
const DAY=86400000;
const d2n=s=>{const[y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY)};
const n2d=n=>new Date(n*DAY);
const dow=n=>((n%7)+11)%7;
const yr=n=>n2d(n).getUTCFullYear();
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOWN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmt=n=>{const d=n2d(n);return MON[d.getUTCMonth()]+" "+d.getUTCDate()+", "+d.getUTCFullYear()};
const fmtS=n=>{const d=n2d(n);return MON[d.getUTCMonth()]+" "+d.getUTCDate()};
const r2=x=>Math.round(x*100)/100;
const f2=x=>(Math.round(x*100)/100).toFixed(2);
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isFinite(v)?v:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayN=(()=>{const t=new Date();return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY)})();

// Spooner holidays
function nthDow(y,m,wd,n){let d=d2n(`${y}-${String(m).padStart(2,"0")}-01`);while(dow(d)!==wd)d++;return d+7*(n-1)}
function lastDow(y,m,wd){let d=nthDow(y,m,wd,1);while(n2d(d+7).getUTCMonth()===m-1)d+=7;return d}
const HOL=[];
for(let y=2025;y<=2029;y++)[[d2n(`${y}-01-01`),"New Year's Day"],[lastDow(y,5,1),"Memorial Day"],[d2n(`${y}-07-04`),"Independence Day"],[nthDow(y,9,1,1),"Labor Day"],[nthDow(y,11,4,4),"Thanksgiving"],[d2n(`${y}-12-25`),"Christmas"]]
  .forEach(([n,name])=>HOL.push({n,name,weekend:dow(n)===0||dow(n)===6}));
const closed=new Set(HOL.filter(h=>!h.weekend).map(h=>h.n));

// Payroll: biweekly Fridays, period ends the Saturday 6 days before; holiday paydays move earlier
const PAYS=[];
for(let f=d2n("2025-12-19");f<=d2n("2029-01-20");f+=14){
  let pay=f;while(closed.has(pay)||dow(pay)===0||dow(pay)===6)pay--;
  const end=f-6;PAYS.push({pay,end,start:end-13,year:yr(pay)});
}
const periodsIn=y=>PAYS.filter(p=>p.year===y).length;
const lastPayOf=y=>PAYS.filter(p=>p.year===y).slice(-1)[0].pay;
const periodFor=n=>PAYS.find(p=>n>=p.start&&n<=p.end);

const opts=PAYS.filter(p=>p.year>=2026&&p.year<=2028);
opts.forEach(p=>{
  [$("anchor"),$("target")].forEach(sel=>{const o=document.createElement("option");o.value=p.pay;o.textContent=fmt(p.pay);sel.appendChild(o)});
});

let reqs=[],uid=0;
function addReq(r){
  r={id:++uid,date:"",hrs:8,bank:"PTO",note:"",...r};reqs.push(r);
  const div=document.createElement("div");div.className="req";
  div.innerHTML=`<label>Date<input type="date" value="${r.date}"></label>
  <label>Hours<input type="number" step="0.25" min="0" value="${r.hrs}"></label>
  <label>Use<select><option>PTO</option><option>PSL</option><option value="FLT">Floating</option></select></label>
  <label class="note">Note<input type="text" value="${esc(r.note)}" autocomplete="off"></label>
  <button type="button" class="x" aria-label="Remove day">×</button>`;
  const [di,hi,ti]=div.querySelectorAll("input");const bs=div.querySelector("select");bs.value=r.bank;
  di.oninput=()=>r.date=di.value;hi.oninput=()=>r.hrs=hi.value;bs.onchange=()=>r.bank=bs.value;ti.oninput=()=>r.note=ti.value;
  div.querySelector("button").onclick=()=>{reqs=reqs.filter(x=>x!==r);div.remove();calc()};
  $("reqRows").appendChild(div);
}
$("addReq").onclick=()=>{addReq({});calc()};

function loadSample(){
  $("name").value="Sample therapist (example numbers)";
  $("anchor").value=String(d2n("2026-10-09"));$("target").value=String(d2n("2027-07-16"));
  $("ptoBal").value="60.00";$("rate").value="5.19";$("pslBal").value="40.00";$("pslUsed").value="0";$("fltBal").value="8";$("hrsWorked").value="80";
  [["2026-11-25",8,"PTO","Day before Thanksgiving"],["2026-12-28",8,"PTO","Holiday break"],["2026-12-29",8,"PTO","Holiday break"],
   ["2027-02-10",4,"PSL","Appointment"],["2027-06-28",8,"FLT","Summer trip"],["2027-06-29",8,"PTO","Summer trip"]]
   .forEach(([date,hrs,bank,note])=>addReq({date,hrs,bank,note}));
}
$("clearBtn").onclick=()=>{
  ["name","rate","ptoBal","pslBal","pslUsed","fltBal"].forEach(id=>$(id).value="");
  $("hrsWorked").value="80";reqs=[];$("reqRows").innerHTML="";addReq({});calc();
};

let M=null;
function calc(){
  const anchorPay=+$("anchor").value, A=PAYS.find(p=>p.pay===anchorPay), aYear=A.year;
  let targetPay=+$("target").value;
  const hourly=$("etype").value==="hourly", rate=num("rate");
  const annual=hourly?Math.round(rate*26):Math.round(rate*periodsIn(aYear));
  const rateFor=y=>hourly||y===aYear?rate:r2(annual/periodsIn(y));
  const pslRate=num("hrsWorked")/30;
  const ready=$("rate").value!==""&&$("ptoBal").value!=="";

  const fb=num("fltBal");
  const banks=[{left:fb,issued:-1e9,expires:1e9}];
  HOL.filter(h=>h.weekend&&h.n>anchorPay).forEach(h=>{const e=n2d(h.n);e.setUTCFullYear(e.getUTCFullYear()+1);banks.push({left:8,issued:h.n,expires:Math.round(e/DAY),name:h.name})});

  const items=reqs.filter(r=>r.date&&+r.hrs>0).map(r=>({n:d2n(r.date),hrs:+r.hrs,bank:r.bank,note:r.note})).sort((a,b)=>a.n-b.n);

  let pto=num("ptoBal"),psl=num("pslBal");
  const paysSoFar=PAYS.filter(p=>p.year===aYear&&p.pay<=anchorPay).length;
  let pslAccY=Math.min(80,pslRate*paysSoFar),ptoAccY=hourly?Math.min(annual,rate*paysSoFar):0,curYear=aYear;
  const pslUsed={[aYear]:num("pslUsed")};
  const fltNow=pay=>banks.filter(b=>!b.done&&b.left>0&&b.issued<=pay).reduce((s,b)=>s+b.left,0);
  const usable=(y)=>Math.max(0,Math.min(psl,40-(pslUsed[y]||0)));
  const start={pay:anchorPay,pto,psl,pslUse:usable(aYear),flt:fb};
  const rows=[];
  const yearEnd=(y,row)=>{
    const lp=Math.max(0,r2(pto-annual)),ls=Math.max(0,r2(psl-40));
    if(lp>0){pto=annual;row.notes.push(`Year end: ${f2(lp)} PTO over the ${annual}-hr carryover is lost`)}
    if(ls>0){psl=40;row.notes.push(`Year end: ${f2(ls)} PSL over the 40-hr rollover is lost`)}
  };
  if(anchorPay===lastPayOf(aYear)){const tmp={notes:[]};yearEnd(aYear,tmp);start.pto=pto;start.psl=psl}
  const between=[];
  PAYS.filter(p=>p.pay>anchorPay&&p.pay<=targetPay).forEach(p=>{
    const y=p.year;
    if(y!==curYear){rows.push({year:y});curYear=y;pslAccY=0;ptoAccY=0}
    const row={pay:p.pay,p,notes:[],used:[]};
    let acc=rateFor(y);if(hourly){acc=Math.max(0,Math.min(acc,annual-ptoAccY));ptoAccY+=acc}
    const pa=Math.max(0,Math.min(pslRate,80-pslAccY));pslAccY+=pa;
    pto=r2(pto+acc);psl=r2(psl+pa);row.ptoAcc=acc;
    HOL.filter(h=>h.weekend&&h.n>=p.start&&h.n<=p.end).forEach(h=>row.notes.push(`${h.name} (${DOWN[dow(h.n)]}): +8 floating hrs`));
    items.filter(i=>i.n>=p.start&&i.n<=p.end).forEach(i=>{
      const iy=yr(i.n);let used=0;
      if(i.bank==="PTO"){used=Math.min(i.hrs,pto);pto=r2(pto-used)}
      else if(i.bank==="PSL"){if(pslUsed[iy]===undefined)pslUsed[iy]=0;used=Math.min(i.hrs,psl,Math.max(0,40-pslUsed[iy]));psl=r2(psl-used);pslUsed[iy]+=used}
      else{let need=i.hrs;banks.filter(b=>!b.done&&b.left>0&&b.issued<=i.n&&b.expires>=i.n).sort((a,b)=>a.expires-b.expires).forEach(b=>{const t=Math.min(need,b.left);b.left=r2(b.left-t);need=r2(need-t)});used=r2(i.hrs-need)}
      const short=r2(i.hrs-used);
      between.push({...i,used,short,pay:p.pay});row.used.push({...i,short});
    });
    banks.forEach(b=>{if(!b.done&&b.expires<p.pay){b.done=true;if(b.left>0)row.notes.push(`${f2(b.left)} floating hrs expired`);b.left=0}});
    if(p.pay===lastPayOf(y))yearEnd(y,row);
    row.pto=pto;row.psl=psl;row.pslUse=usable(y);row.flt=fltNow(p.pay);
    rows.push(row);
  });
  const end=rows.filter(r=>r.pay).slice(-1)[0]||{pay:anchorPay,pto:start.pto,psl:start.psl,pslUse:start.pslUse,flt:start.flt};
  const later=items.filter(i=>{const p=periodFor(i.n);return p&&p.pay>targetPay&&p.pay>anchorPay});
  M={ready,start,end,rows,between,later,targetPay,anchorPay,annual,rate,hourly,aYear};
  render();
}

function balBox(cls,label,b){
  const tot=b.pto+b.pslUse+b.flt;
  return `<div class="bal ${cls}"><div class="when">${label}</div><div class="date">Paycheck ${fmt(b.pay)}</div>
  <dl><dt>PTO</dt><dd>${f2(b.pto)}</dd><dt>PSL you can use${b.psl>b.pslUse+0.004?` <small>(of ${f2(b.psl)})</small>`:""}</dt><dd>${f2(b.pslUse)}</dd>
  <dt>Floating holiday</dt><dd>${f2(b.flt)}</dd><dt class="tot">Total time off</dt><dd>${f2(tot)}</dd></dl></div>`;
}
const bankName=b=>b==="FLT"?"Floating":b;

function render(){
  const show=M.ready;
  ["results","betweenCard","ledgerCard"].forEach(id=>$(id).hidden=!show&&id!=="results");
  if(!show){$("compare").innerHTML=`<div class="card empty" style="grid-column:1/-1">Enter your PTO balance and PTO earned per paycheck to see what you'll have.</div>`;$("printhead").innerHTML="";return}
  if(M.targetPay<=M.anchorPay){$("compare").innerHTML=`<div class="card empty" style="grid-column:1/-1">Pick a "What will I have on" paycheck after ${fmt(M.anchorPay)}.</div>`;$("betweenCard").hidden=true;$("ledgerCard").hidden=true;return}
  $("compare").innerHTML=balBox("now","I have",M.start)+`<div class="arrow" aria-hidden="true">→</div>`+balBox("later","I'll have",M.end);

  // time off between
  const tot={PTO:0,PSL:0,FLT:0};let shortT=0;
  let h=`<h2>Planned time off between these paychecks</h2>`;
  if(!M.between.length)h+=`<p class="empty" style="margin:0">None entered.</p>`;
  else{
    h+=`<div class="tablewrap"><table><thead><tr><th class="l">Date</th><th class="l">Note</th><th class="l">From</th><th>Hours</th></tr></thead><tbody>`;
    M.between.forEach(i=>{tot[i.bank]+=i.hrs;shortT+=i.short;
      h+=`<tr><td class="l">${DOWN[dow(i.n)]} ${fmt(i.n)}</td><td class="l wr">${esc(i.note)}</td><td class="l">${bankName(i.bank)}</td><td class="n${i.short>0?" short":""}">${f2(i.hrs)}${i.short>0?` (${f2(i.short)} not covered)`:""}</td></tr>`});
    const parts=["PTO","PSL","FLT"].filter(k=>tot[k]>0).map(k=>`${bankName(k)} ${f2(tot[k])}`).join(" · ");
    h+=`</tbody><tfoot><tr><td class="l" colspan="3">Total · ${parts}</td><td class="n">${f2(tot.PTO+tot.PSL+tot.FLT)}</td></tr></tfoot></table></div>`;
  }
  if(M.later.length)h+=`<p class="sub">${M.later.length} planned day(s) come after ${fmt(M.targetPay)} and aren't counted here.</p>`;
  $("betweenCard").innerHTML=h;

  // ledger
  let t=`<thead><tr><th class="l">Paycheck</th><th>PTO</th><th>PSL</th><th>Floating</th><th>Total</th><th class="l">Time off / notes</th></tr></thead><tbody>`;
  const s=M.start;
  t+=`<tr><td class="l">${fmtS(s.pay)}, ${yr(s.pay)}</td><td class="n">${f2(s.pto)}</td><td class="n">${f2(s.pslUse)}</td><td class="n">${f2(s.flt)}</td><td class="n"><b>${f2(s.pto+s.pslUse+s.flt)}</b></td><td class="l wr empty">Starting balances</td></tr>`;
  M.rows.forEach(r=>{
    if(r.year){t+=`<tr class="yr"><td colspan="6">${r.year}</td></tr>`;return}
    const notes=r.used.map(u=>`${f2(u.hrs)} ${bankName(u.bank)}${u.note?" – "+esc(u.note):""}${u.short>0?` (${f2(u.short)} not covered)`:""}`).concat(r.notes);
    t+=`<tr><td class="l">${fmtS(r.pay)}</td><td class="n">${f2(r.pto)}</td><td class="n">${f2(r.pslUse)}</td><td class="n">${f2(r.flt)}</td><td class="n"><b>${f2(r.pto+r.pslUse+r.flt)}</b></td><td class="l wr">${notes.join("; ")}</td></tr>`;
  });
  $("ledger").innerHTML=t+`</tbody>`;

  $("printhead").innerHTML=`<h1>Time Off Planner${$("name").value?": "+esc($("name").value):""}</h1>
  <p>PTO earned ${f2(M.rate)} per paycheck${M.hourly?" (hourly)":` (${M.annual} hrs/yr)`} · PSL used in ${M.aYear} before ${fmt(M.anchorPay)}: ${f2(num("pslUsed"))} · Printed ${fmt(todayN)}</p>`;
}

function summary(){
  if(!M||!M.ready)return "";
  const b=(l,x)=>`${l} (paycheck ${fmt(x.pay)}): PTO ${f2(x.pto)}, PSL ${f2(x.pslUse)}, floating ${f2(x.flt)} = ${f2(x.pto+x.pslUse+x.flt)} hrs`;
  const L=[`Time off: ${$("name").value||""}`.trim(),b("I have",M.start),"Planned time off:"];
  M.between.forEach(i=>L.push(`  • ${fmt(i.n)}: ${f2(i.hrs)} hrs ${bankName(i.bank)}${i.note?" ("+i.note+")":""}`));
  if(!M.between.length)L.push("  • none");
  L.push(b("I'll have",M.end));
  return L.join("\n");
}

document.querySelector(".wrap").addEventListener("input",calc);
document.querySelector(".wrap").addEventListener("change",calc);
$("copyBtn").onclick=()=>{
  const t=summary();const ok=()=>{$("copied").hidden=false;setTimeout(()=>$("copied").hidden=true,1800)};
  const fb=()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){}ta.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
};
let top=false;try{top=window.self===window.top}catch(e){}
if(top){$("printBtn").hidden=false;$("printBtn").onclick=()=>window.print()}

loadSample();calc();
})();
</script>
